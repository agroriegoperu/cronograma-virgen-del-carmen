<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Gantt – Sistema de Riego</title>
  <style>
    html, body { margin: 0; height: 100%; background: #f3f5f8; }
    iframe { display: block; width: 100%; height: 100vh; height: 100dvh; border: 0; }
  </style>
</head>
<body>
  <iframe id="gantt" allow="clipboard-write"></iframe>
  <script>
    var URL_GANTT = 'https://script.google.com/macros/s/AKfycbyuJagk1CCb2e6IwunhU7G-yrtbrXbBDjNsCJCrO4R411oNQ_jDVJoLZlTCYK82HrmL6Q/exec';
    var etapa = new URLSearchParams(location.search).get('etapa');
    document.getElementById('gantt').src = URL_GANTT + (etapa ? '?etapa=' + encodeURIComponent(etapa) : '');
  </script>
</body>
</html>
